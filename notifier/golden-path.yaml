apiVersion: platform.example.com/v1
kind: GoldenPath
metadata:
  name: notifier
  owner: team-platform
spec:
  archetype: event-driven
  cloud: aws
  tier: silver
  size: S
  cost_profile: balanced
  arch: arm64
  data_class: internal   # messages carry summaries and links, not sensitive detail
  network: public        # GitLab and GitHub webhooks need a public endpoint behind a WAF
  integrations: [event-bus, secrets]
  environments: [dev, stage, prod]
  lifecycle: persistent
